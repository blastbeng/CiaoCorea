name: ciaocorea

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ciaocorea:0.1.0
    container_name: ciaocorea
    restart: unless-stopped

    ports:
      - "${WEB_PORT:-18091}:8080"

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '8080'
      DATA_DIR: /data
      WEB_DIST: /app/web
      # Dietro HTTPS metti 1: il cookie di sessione diventa Secure.
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_WINDOW_MINUTES: ${LOGIN_WINDOW_MINUTES:-15}

    # Credenziali dell'unico account: fuori dal repository, leggibili solo
    # dall'utente che avvia il servizio.
    env_file:
      - ../.secrets/ciaocorea.env

    volumes:
      - ./data:/data

    mem_limit: 512m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

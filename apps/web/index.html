<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      // Il tema va scritto prima del primo disegno: senza questo, chi ha scelto
      // il chiaro vedrebbe un lampo scuro a ogni ricarica (e viceversa).
      try {
        var savedTheme = localStorage.getItem('ciaocorea.theme.v1');
        document.documentElement.dataset.theme = savedTheme === 'light' ? 'light' : 'dark';
      } catch (error) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <meta
      name="description"
      content="CiaoCorea: impara a leggere, scrivere e capire il coreano in autonomia, con un piano di studio progressivo."
    />
    <title>CiaoCorea – Impara il Coreano</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
